<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play ForestX</title>
<meta name="description" content="Play the ForestX single-file browser client, fullscreen.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  /* Sizing is inline on purpose: the game must cover the whole screen
     no matter what (no external stylesheet / cache can shrink it). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; color: #eaf7ec; }

  /* The client fills the ENTIRE viewport — edge to edge. */
  #gameFrame {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    border: 0; display: block; background: #000;
  }

  /* One small floating back link; gone while fullscreen. */
  .back {
    position: fixed; top: 12px; left: 12px; z-index: 20;
    background: rgba(7,19,10,.82); color: #a9c8ae; text-decoration: none;
    font-weight: 700; font-size: .85rem; padding: .5rem .85rem;
    border: 1px solid #2b5a32; border-radius: 999px; backdrop-filter: blur(6px);
  }
  .back:hover { color: #fff; border-color: #59c93c; }

  /* Full-screen start overlay: one click = real fullscreen
     (requestFullscreen needs a user gesture, so this click is it). */
  .start {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.1rem; text-align: center; padding: 2rem;
    background: radial-gradient(800px 420px at 50% 0%, #2e7d2555, transparent 65%),
                linear-gradient(180deg, rgba(8,26,16,.96), rgba(7,19,10,.98));
  }
  .start.hidden { display: none; }
  .start h1 {
    font-family: "Press Start 2P", monospace; font-size: clamp(1.6rem, 5vw, 3rem);
    color: #f4fff0; text-shadow: 0 4px 0 #2f8f1f, 0 8px 0 #1c5c12;
  }
  .start h1 span { color: #59c93c; }
  .start p { color: #a9c8ae; max-width: 34rem; }
  .start-btn {
    font-family: "Press Start 2P", monospace; font-size: clamp(.8rem, 2.2vw, 1.1rem);
    color: #fff; background: linear-gradient(180deg, #74d84f, #46a81f 55%, #378a17);
    text-shadow: 2px 2px 0 #1d4d0c; border: 3px solid #000; cursor: pointer;
    padding: 1.3rem 2.4rem;
    box-shadow: inset 0 5px 0 #a6ec8a, inset 0 -6px 0 #256b0f,
                inset 5px 0 0 #4fae2a, inset -5px 0 0 #4fae2a, 0 8px 0 rgba(0,0,0,.5);
  }
  .start-btn:hover { filter: brightness(1.13); }
  .start-btn:active { transform: translateY(4px); }
  .start small { color: #7ea487; }
  .start small a { color: #59c93c; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- The actual ForestX client, embedded edge-to-edge. -->
<iframe
  id="gameFrame"
  src="https://v0-forestx.vercel.app/play"
  title="ForestX client"
  allow="fullscreen; pointer-lock; autoplay; clipboard-write; gamepad; keyboard-map"
  allowfullscreen>
</iframe>

<a class="back" href="index.html">← ForestX</a>

<div class="start" id="startOverlay">
  <h1>FOREST<span>X</span></h1>
  <button class="start-btn" id="startBtn" type="button">▶ PLAY FULLSCREEN</button>
  <p>Click the game once it loads to capture your mouse · ESC releases it.<br>
     First launch can take a bit — it's unpacking ~86 MB of game.</p>
  <small>Black screen or blocked by your network?
    <a href="https://v0-forestx.vercel.app/play">Open the client directly ↗</a> ·
    <a href="https://v0-forestx.vercel.app/forestx.html" download>download forestx.html</a>
  </small>
</div>

<script>
  const frame = document.getElementById("gameFrame");
  const overlay = document.getElementById("startOverlay");

  document.getElementById("startBtn").addEventListener("click", async () => {
    overlay.classList.add("hidden");
    try { await frame.requestFullscreen(); } catch { /* still fills the window */ }
    frame.focus();
  });

  // If the player exits fullscreen (ESC), don't trap them — the game
  // keeps running window-filling, and the overlay stays gone.
</script>
</body>
</html>
